name: Verify engineering evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Generate and verify the decision workflow
        run: npm test
      - name: Verify generated workflow is committed
        run: git diff --exit-code -- workflow
      - name: Exercise HTTP and SSE failure contracts
        run: node tools/api-contract-lab.mjs --selftest
      - name: Exercise queue recovery, queries and retry policy
        run: node --test runledger/test/*.test.mjs
      - name: Reproduce concurrent idempotent submissions
        run: node runledger/verify-workload.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Select runner browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            browser_executable=$(command -v google-chrome)
            echo "CHROMIUM_EXECUTABLE=$browser_executable" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Exercise console and viewport behavior
        env:
          RUNLEDGER_SCREENSHOT: artifacts/runledger-desktop.png
          RUNLEDGER_MOBILE_SCREENSHOT: artifacts/runledger-mobile.png
          RUNLEDGER_REPLAY_SCREENSHOT: artifacts/runledger-replay-mobile.png
        run: node scripts/verify_runledger_browser.mjs
      - name: Save verified console screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runledger-console
          path: artifacts/*.png
          if-no-files-found: error
          retention-days: 7
